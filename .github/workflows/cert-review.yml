name: cert-review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'cert-review-approved') || (github.event.action == 'edited' && !github.event.changes.base)) && format('cert-review-noop-{0}', github.run_id) || format('cert-review-{0}-{1}', github.event_name == 'pull_request' && 'leg' || 'pr', github.event.pull_request.number || github.event.merge_group.head_sha) }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  cert:
    name: cert
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/cert-review.yml@22c8d4af6e87e18b5189cb4c44bd8fef37fb3d3f
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: write
      issues: write
      pull-requests: write
    with:
      tools-ref: 22c8d4af6e87e18b5189cb4c44bd8fef37fb3d3f
      rules: scripts/cert/review.txt
      loud: |
        extension/**
        six/**
      guard-paths: |
        .github/workflows/**
        .github/actions/**
        scripts/cert/**
        scripts/gate.mjs
        scripts/is-main.mjs
      evidence-workflow: ci.yml
      evidence-artifacts: |
        guard-rows
      evidence-wait-minutes: 60
    secrets:
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
