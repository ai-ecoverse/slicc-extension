name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      six_ref:
        description: "Six release tag to build (default: from .six-tag)"
        required: false
        type: string
      publish_tag:
        description: "Publish this existing release tag (e.g. v7.4.1) instead of cutting a release"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.publish_tag == '' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      LEFTHOOK: "0"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish_tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          SIX_REF: ${{ inputs.six_ref || '' }}

      - run: npm run lint

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    if: always() && vars.CWS_PUBLISH_ENABLED == 'true' && (needs.release.result == 'success' || (inputs.publish_tag != '' && needs.release.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - name: Verify environment has required reviewers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          ENV_NAME="chrome-web-store"
          RULES=$(gh api "repos/${REPO}/environments/${ENV_NAME}" \
            --jq '.protection_rules // [] | map(select(.type == "required_reviewers")) | length' \
            2>/dev/null || echo "0")
          if [ "$RULES" = "0" ]; then
            echo "::error::The ${ENV_NAME} environment has no required reviewers. Refusing to publish."
            exit 1
          fi
          echo "Environment ${ENV_NAME} has required reviewers — proceeding."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Detect release version
        id: version
        run: |
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
          WANT="${{ inputs.publish_tag }}"
          if [ -n "$WANT" ] && [ "$TAG" != "$WANT" ]; then
            echo "::error::publish_tag $WANT is not an exact release tag at the checked-out commit"
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release asset
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "v${{ steps.version.outputs.version }}" \
            --pattern 'slicc-extension.zip' \
            --dir artifacts

      - name: Publish to Chrome Web Store
        if: steps.version.outputs.skip == 'false'
        env:
          CHROME_WEB_STORE_PUBLISHER_ID: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
          CHROME_WEB_STORE_ITEM_ID: ${{ vars.CHROME_WEB_STORE_ITEM_ID }}
          CHROME_WEB_STORE_PUBLISH_TYPE: ${{ vars.CHROME_WEB_STORE_PUBLISH_TYPE }}
          CHROME_WEB_STORE_DEPLOY_PERCENTAGE: ${{ vars.CHROME_WEB_STORE_DEPLOY_PERCENTAGE }}
          CHROME_WEB_STORE_FORCE_CANCEL_PENDING: ${{ vars.CHROME_WEB_STORE_FORCE_CANCEL_PENDING }}
          CHROME_WEB_STORE_SKIP_REVIEW: ${{ vars.CHROME_WEB_STORE_SKIP_REVIEW }}
          CHROME_WEB_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_WEB_STORE_SERVICE_ACCOUNT_JSON }}
          EXTENSION_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/cws-publish.mjs
