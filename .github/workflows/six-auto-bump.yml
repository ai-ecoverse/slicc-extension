name: Six Auto-Bump

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SIX_BUMP_DEPLOY_KEY }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check for six update and build comparison
        id: check
        run: node scripts/six-auto-bump.mjs

      - name: Lint
        if: steps.check.outputs.release == 'true'
        run: npm run lint

      - name: Chromium system dependencies
        if: steps.check.outputs.release == 'true'
        run: |
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then
            npx playwright-core install-deps chromium
          else
            echo "::notice title=Chromium system dependencies::No root on $RUNNER_NAME, so install-deps is skipped and the runner image's system libraries serve Chromium."
          fi

      - name: Integration tests
        if: steps.check.outputs.release == 'true'
        run: npm test
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Commit and push
        if: steps.check.outputs.bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .six-tag
          if [ "${{ steps.check.outputs.release }}" = "true" ]; then
            git commit -m "fix: build six ${{ steps.check.outputs.new_tag }}"
          else
            git commit -m "chore: advance six pin to ${{ steps.check.outputs.new_tag }}"
          fi
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
