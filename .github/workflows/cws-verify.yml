name: cws-verify

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cws-verify
  cancel-in-progress: false

jobs:
  verify:
    name: store crx = release zip
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version

      - name: The store's live crx, minus _metadata/ and update_url, is byte-identical to its release zip
        env:
          GH_TOKEN: ${{ github.token }}
          ITEM_ID: ${{ vars.CHROME_WEB_STORE_ITEM_ID }}
        run: node scripts/gate.mjs cws-verify -- node scripts/cert/cws-verify.mjs | tee -a "$GITHUB_STEP_SUMMARY"
