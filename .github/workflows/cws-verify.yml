name: cws-verify

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cws-verify
  cancel-in-progress: false

jobs:
  verify:
    name: store crx = release zip = rebuild
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    env:
      LEFTHOOK: "0"
      GH_TOKEN: ${{ github.token }}
      ITEM_ID: ${{ vars.CHROME_WEB_STORE_ITEM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version

      - id: probe
        name: The version the store serves, and whether it is verified already
        shell: bash
        run: node scripts/cert/cws-verify.mjs --probe

      - name: Rebuild that release from its tag
        if: steps.probe.outputs.recorded != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.probe.outputs.tag }}
          path: rebuild
          persist-credentials: false

      - if: steps.probe.outputs.recorded != 'true'
        shell: bash
        working-directory: rebuild
        env:
          VERSION: ${{ steps.probe.outputs.version }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node scripts/pack.mjs "$VERSION"

      - name: The store's crx, minus _metadata/ and update_url, is byte-identical to the release zip and to the rebuild
        shell: bash
        env:
          VERSION: ${{ steps.probe.outputs.version }}
          REBUILT: ${{ steps.probe.outputs.recorded != 'true' && 'rebuild/artifacts/slicc-extension.zip' || '' }}
        run: |
          args=(--expect "$VERSION")
          [ -n "$REBUILT" ] && args+=(--rebuilt "$REBUILT")
          node scripts/gate.mjs cws-verify -- node scripts/cert/cws-verify.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
