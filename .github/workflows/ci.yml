name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          FORCED: ${{ vars.CI_RUNNER }}
          POOL: ${{ vars.CERT_RUNNER || 'cloud-run-bench' }}
        with:
          script: |
            const hosted = 'ubuntu-latest';
            const pick = async (runner, why) => {
              core.setOutput('runner', runner);
              await core.summary.addRaw(`runner: ${runner} (${why})\n`).write();
            };
            if (process.env.FORCED) return await pick(process.env.FORCED, 'vars.CI_RUNNER');
            const pool = process.env.POOL;
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              const head = context.payload.pull_request.head.repo;
              const same = head && head.full_name === `${owner}/${repo}`;
              return same ? await pick(pool, 'same-repo PR') : await pick(hosted, 'fork PR');
            }
            if (context.eventName === 'merge_group') {
              const base = context.payload.merge_group.base_ref.replace('refs/heads/', '');
              const q = await github.graphql(
                `query($o:String!,$n:String!,$b:String!){repository(owner:$o,name:$n){mergeQueue(branch:$b){entries(first:100){nodes{pullRequest{number isCrossRepository}}}}}}`,
                { o: owner, n: repo, b: base }
              );
              const entries = q.repository.mergeQueue?.entries?.nodes ?? [];
              const forks = entries.filter((e) => e.pullRequest?.isCrossRepository !== false);
              return forks.length === 0
                ? await pick(pool, `merge group, ${entries.length} same-repo entries`)
                : await pick(hosted, `merge group with a fork or unknown PR: ${forks.map((e) => e.pullRequest?.number).join(', ')}`);
            }
            if (context.eventName === 'push' && context.ref === 'refs/heads/main') return await pick(pool, 'push to main');
            await pick(hosted, context.eventName);

  ci:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 15
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - name: Chromium system dependencies
        run: |
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then
            npx playwright-core install-deps chromium
          else
            echo "::notice title=Chromium system dependencies::No root on $RUNNER_NAME, so install-deps is skipped and the runner image's system libraries serve Chromium."
          fi

      - name: Integration tests with coverage, CPU profiles, and screenshots
        run: npm test
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
