name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  statuses: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/pipeline.yml@v2.17.0
    secrets: inherit
    with:
      test-glob: test/integration/guard*.test.mjs
      shards: 5
      timeout-minutes: 45
      review-timeout-minutes: 90
      node-options: --max-old-space-size=4096
      strict-tests: |
        test/integration/guard-cookie-plant-vault-diag.test.mjs
        test/integration/guard-renew.test.mjs
        test/integration/guard-report.test.mjs
        test/integration/guard-seven-lagging.test.mjs
        test/integration/guard-seven-prompt.test.mjs
        test/integration/guard-six-bridge-lagging.test.mjs
        test/integration/guard-six-bridge-prompt.test.mjs
        test/integration/guard-stall.test.mjs
      review-prompt: |
        Diagnostic draft for a CI guard attach timing probe. Keep the review short and neutral. Do not request merge readiness.
