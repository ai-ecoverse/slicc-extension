<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SLICC</title>
    <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #1e1e1e;
    }
    #cherry-follower {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #cherry-status {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: #1e1e1e;
      color: #aaa;
      font: 14px system-ui;
      text-align: center;
    }
    #cherry-status[data-state="starting"],
    #cherry-status[data-state="slow"],
    #cherry-status[data-state="tab"],
    #cherry-status[data-state="disconnected"] {
      display: flex;
    }
    #cherry-status-action {
      font: inherit;
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid #666;
      background: transparent;
      color: #eee;
      cursor: pointer;
    }
    #cherry-status-action[hidden] {
      display: none;
    }
    </style>
  </head>
  <body>
    <div id="cherry-status" data-state="starting">
      <span id="cherry-status-text">Starting SLICC…</span>
      <button id="cherry-status-action" type="button" hidden></button>
    </div>

    <iframe
      id="cherry-follower"
      allow="camera; microphone; display-capture; clipboard-read; clipboard-write"
    ></iframe>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
