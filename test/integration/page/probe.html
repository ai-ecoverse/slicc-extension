<!doctype html>
<meta charset="utf-8">
<title>vault probe</title>
<script>
const params = new URLSearchParams(location.search);
const init = params.has('init') ? JSON.parse(params.get('init')) : undefined;
const target = params.get('url');
fetch(target, init).then(
  async (response) => {
    parent.postMessage(
      {
        ok: true,
        origin: location.origin,
        path: new URL(target).pathname,
        status: response.status,
        text: await response.text(),
        header: response.headers.get('x-upstream'),
      },
      'https://seven.sliccy.ai'
    );
  },
  (error) => {
    parent.postMessage(
      {
        ok: false,
        origin: location.origin,
        path: new URL(target).pathname,
        name: error.name,
      },
      'https://seven.sliccy.ai'
    );
  }
);
</script>
